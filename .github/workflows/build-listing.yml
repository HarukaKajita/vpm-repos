name: Build Repo Listing

# listing は source.json の githubRepos に挙げたリポジトリの GitHub Release から生成される。
# そのため「新しいリリースを切っただけ」では source.json が変わらず、push トリガーは発火しない。
# 実際に UEL 1.3.2 をリリースしても listing が 1.3.1 のまま数時間放置される事故が起きた（2026-07-30）。
#
# 対策は 2 段構え。
#   - リリース手順（release-unity-package スキル）から workflow_dispatch で即時に叩く（遅延ゼロ）
#   - 叩き忘れても翌日には追いつくよう schedule を置く（取りこぼしの受け皿）
on:
  workflow_dispatch:
  push:
    branches: main
    paths: source.json
  schedule:
    # 毎日 03:10 UTC（JST 12:10）。リリース時の即時起動を忘れた場合の保険。
    - cron: '10 3 * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  
# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true
  
env:
  listPublishDirectory: Website
  pathToCi: ci

jobs:
  
  build-listing:
    name: build-listing
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      
      - uses: actions/checkout@v4 # check out this repo
      - uses: actions/checkout@v4 # check out automation repo
        with:
          repository: vrchat-community/package-list-action
          path: ${{env.pathToCi}}
          clean: false # otherwise the local repo will no longer be checked out
          
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{env.pathToCi}}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}
          
      - name: Build Package Version Listing
        run: ${{env.pathToCi}}/build.cmd BuildMultiPackageListing --root ${{env.pathToCi}} --list-publish-directory $GITHUB_WORKSPACE/${{env.listPublishDirectory}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{env.listPublishDirectory}}
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4