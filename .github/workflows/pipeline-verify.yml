name: パイプライン標準準拠検査

# ゴールド標準 §2.10 第 2 層の検査を CI でも走らせる。Unity は不要で Python 3 だけで動く。
# スキルのスコープと兄弟リポジトリは CI では解決できないため、検査 10 は自動的に warn へ落ちる
# （ローカルとリリースゲートで error として効く）。

on:
  push:
    branches: [main, develop, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # 検査 15（同梱画像の鮮度）と検査 16（同梱物の変更の記録漏れ）は履歴とタグで判定する。
      # 既定の浅い clone だとタグが 1 つも無く、`git log -1 -- <path>` も全パスで同じ時刻を返すため、
      # どちらも黙って空振りする（＝ CI が緑でも何も見ていない状態になる）。全履歴を取る。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: パイプラインスクリプトの回帰テスト（正本リポジトリのみ）
        run: |
          found=0
          for test in scripts/pipeline/test_*.py; do
            [ -f "$test" ] || continue
            found=1
            python3 "$test"
          done
          [ "$found" = 1 ] || echo "配布先のため回帰テストはスキップします"

      - name: 標準準拠検査
        run: python3 scripts/pipeline/verify_repo_guide.py
